<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Luxe Talent</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-cube"></i> <span class="company-name-el">Luxe Talent</span></div>
      <div class="user-profile">
        <div class="avatar" id="user-avatar-initials">AR</div>
        <div class="info"><h4 id="user-display-name">Alexandra Reid</h4><span id="user-display-role" class="badge-role">ADMIN</span></div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="employees.html" class="nav-item"><i class="fa-solid fa-users"></i> Employees</a>
        <a href="leaves.html" class="nav-item"><i class="fa-solid fa-envelope-open-text"></i> Leave Requests</a>
        <a href="settings.html" class="nav-item"><i class="fa-solid fa-sliders"></i> Settings</a>
      </nav>
      <div class="sidebar-footer"><button id="logout-btn" class="btn btn-outline btn-block">Sign Out</button></div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div><h1>Admin Dashboard</h1><p class="subtitle">Overview and workplace analytics</p></div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btn btn-primary" id="open-add-modal"><i class="fa-solid fa-user-plus"></i> Add Employee</button>
          <span id="current-date"></span>
        </div>
      </header>

      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-icon blue"><i class="fa-solid fa-users"></i></div><div><p>Total Staff</p><h3 id="kpi-total-emp">0</h3></div></div>
        <div class="kpi-card"><div class="kpi-icon green"><i class="fa-solid fa-user-check"></i></div><div><p>Present Today</p><h3 id="kpi-present-today">0</h3></div></div>
        <div class="kpi-card"><div class="kpi-icon yellow"><i class="fa-solid fa-user-clock"></i></div><div><p>Late Arrivals</p><h3 id="kpi-late-today">0</h3></div></div>
        <div class="kpi-card"><div class="kpi-icon red"><i class="fa-solid fa-user-minus"></i></div><div><p>On Leave</p><h3 id="kpi-leave-today">0</h3></div></div>
      </div>

      <div class="card">
        <h3>Today's Live Attendance Status</h3>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Employee</th><th>Department</th><th>Check In</th><th>Check Out</th><th>Status</th></tr></thead>
            <tbody id="today-attendance-table"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="add-emp-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-modal" id="close-emp-modal">&times;</span>
      <h2>Add New Employee</h2>
      <form id="add-emp-form" class="mt-15">
        <div class="form-group"><label>Full Name</label><input type="text" id="new-emp-name" required /></div>
        <div class="form-group"><label>Email Address</label><input type="email" id="new-emp-email" required /></div>
        <div class="form-group"><label>Password</label><input type="password" id="new-emp-pass" required /></div>
        <div class="form-group"><label>Department</label>
          <select id="new-emp-dept" required><option value="HR">HR</option><option value="IT">IT</option><option value="Finance">Finance</option><option value="Sales">Sales</option></select>
        </div>
        <div class="form-group"><label>Monthly Salary ($)</label><input type="number" id="new-emp-salary" min="1" required /></div>
        <button type="submit" class="btn btn-primary btn-block">Save Employee</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
