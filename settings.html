<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Luxe Talent</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand"><i class="fa-solid fa-cube"></i> <span class="company-name-el">Luxe Talent</span></div>
      <div class="user-profile">
        <div class="avatar" id="user-avatar-initials">AR</div>
        <div class="info"><h4 id="user-display-name">Alexandra Reid</h4><span id="user-display-role" class="badge-role">ADMIN</span></div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="employees.html" class="nav-item"><i class="fa-solid fa-users"></i> Employees</a>
        <a href="leaves.html" class="nav-item"><i class="fa-solid fa-envelope-open-text"></i> Leave Requests</a>
        <a href="settings.html" class="nav-item active"><i class="fa-solid fa-sliders"></i> Settings</a>
      </nav>
      <div class="sidebar-footer"><button id="logout-btn" class="btn btn-outline btn-block">Sign Out</button></div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div><h1>Office Settings</h1><p class="subtitle">Configure timing and grace periods</p></div>
      </header>

      <div class="card" style="max-width: 500px;">
        <form id="settings-form">
          <div class="form-group"><label>Office Start Time</label><input type="time" id="setting-start-time" required /></div>
          <div class="form-group"><label>Grace Period (Minutes)</label><input type="number" id="setting-grace-minutes" required /></div>
          <div class="form-group"><label>Yearly Leave Quota</label><input type="number" id="setting-leave-quota" required /></div>
          <button type="submit" class="btn btn-primary">Save Settings</button>
        </form>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
